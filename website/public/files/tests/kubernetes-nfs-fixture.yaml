apiVersion: v1
kind: Namespace
metadata:
  name: rivomesh-shared-nfs
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ganesha
  namespace: rivomesh-shared-nfs
data:
  ganesha.conf: |
    NFS_CORE_PARAM {
      Protocols = 4; Enable_UDP = false; Enable_NLM = false; Enable_RQUOTA = false;
    }
    NFSv4 { Graceless = true; }
    EXPORT {
      Export_Id = 1; Path = /export; Pseudo = /; Access_Type = RW;
      Transports = TCP; Protocols = 4; Squash = No_Root_Squash; SecType = sys;
      FSAL { Name = VFS; }
    }
    LOG { Default_Log_Level = INFO; }
---
apiVersion: v1
kind: Service
metadata:
  name: ganesha
  namespace: rivomesh-shared-nfs
spec:
  selector:
    app: ganesha
  ports:
    - port: 2049
---
apiVersion: v1
kind: Pod
metadata:
  name: ganesha
  namespace: rivomesh-shared-nfs
  labels:
    app: ganesha
spec:
  containers:
    - name: ganesha
      image: ghcr.io/kubernetes-sigs/nfs-ganesha:v6.5
      securityContext:
        privileged: true
      command:
        - /bin/sh
        - -ec
        - |
          mkdir -p /usr/local/var/run/ganesha /usr/local/var/lib/nfs/ganesha /var/run/ganesha /var/lib/nfs/ganesha
          chmod 0777 /export
          exec /usr/local/bin/ganesha.nfsd -F -L STDOUT -f /config/ganesha.conf
      ports:
        - containerPort: 2049
      readinessProbe:
        tcpSocket:
          port: 2049
      volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: export
          mountPath: /export
  volumes:
    - name: config
      configMap:
        name: ganesha
    - name: export
      emptyDir: {}
