# Copy once per node; each node must have independent local tasks/data directories.
bind: 127.0.0.1
port: 8080
authToken: ${RIVOMESH_TOKEN}
tasksDirectory: tasks
dataDirectory: ../data/platform-node
cluster:
  id: migration-registry
  nodeId: ${RIVOMESH_NODE_ID}
  driver: org.postgresql.Driver
  url: jdbc:postgresql://127.0.0.1:5432/rivomesh_control
  username: ${RIVOMESH_CONTROL_USERNAME}
  password: ${RIVOMESH_CONTROL_PASSWORD}
  namespace: rivomesh_control
  heartbeatMillis: 2000
  leaseMillis: 15000
  maximumNodes: 1000
sessions:
  secureCookie: false # Explicit local HTTP preview; production requires HTTPS.
