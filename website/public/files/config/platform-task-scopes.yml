# Exact task grants; users without taskIds keep deployment-wide access.
bind: 127.0.0.1
port: 8080
users:
  - id: migration-admin
    role: ADMIN
    token: ${RIVOMESH_ADMIN_TOKEN}
  - id: migration-operator
    role: OPERATOR
    taskIds: [sales-migration, orders-migration]
    token: ${RIVOMESH_OPERATOR_TOKEN}
  - id: migration-reader
    role: VIEWER
    taskIds: [sales-migration]
    token: ${RIVOMESH_VIEWER_TOKEN}
tasksDirectory: tasks
dataDirectory: ../data/platform
maxTasks: 20
maxRunningTasks: 2
workerHeapMiB: 256
controlThreads: 4
pollMillis: 3000
autoStart: false

# Logical audit retention; protect/monitor the persistent data directory.
auditMaxEvents: 1000000

# Local HTTP preview only. Use secureCookie: true behind production HTTPS.
sessions:
  secureCookie: false
