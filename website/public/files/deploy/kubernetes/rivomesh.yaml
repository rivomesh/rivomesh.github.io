---
# Source: rivomesh/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: rivomesh-config
data:
  platform.yml: |
    bind: 0.0.0.0
    port: 8080
    accessMode: CONFIG
    authToken: ${RIVOMESH_TOKEN}
    tasksDirectory: /app/data/tasks
    dataDirectory: /app/data/controller
    maxTasks: 20
    maxRunningTasks: 2
    workerHeapMiB: 256
    controlThreads: 4
    pollMillis: 3000
    autoStart: false
    auditMaxEvents: 1000000
    sessions:
      enabled: true
      secureCookie: true
      rememberBrowser: false
      idleSeconds: 1800
      absoluteSeconds: 28800
      maximum: 1000
---
# Source: rivomesh/templates/pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rivomesh-data
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: "10Gi"
---
# Source: rivomesh/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: rivomesh
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rivomesh
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Source: rivomesh/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rivomesh
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rivomesh
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rivomesh
      annotations:
        checksum/config: 3708ef53a555c1efdbfa8379c043b3f79a849427087cc67cecd7b1bc1540b445
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: rivomesh
          image: "rivomesh:0.1.0-SNAPSHOT"
          imagePullPolicy: IfNotPresent
          args: [serve, /app/config/platform.yml]
          env:
            - name: RIVOMESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rivomesh-auth
                  key: token
            - name: JAVA_TOOL_OPTIONS
              value: -Xmx512m
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - {name: config, mountPath: /app/config, readOnly: true}
            - {name: data, mountPath: /app/data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: rivomesh-config
        - name: data
          persistentVolumeClaim:
            claimName: rivomesh-data
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
