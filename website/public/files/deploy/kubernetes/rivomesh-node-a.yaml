---
# Source: rivomesh/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: rivomesh-node-a-config
data:
  platform.yml: |
    bind: 0.0.0.0
    port: 8080
    accessMode: CONFIG
    authToken: ${RIVOMESH_TOKEN}
    tasksDirectory: /app/data/tasks
    dataDirectory: /app/data/controller
    maxTasks: 20
    maxRunningTasks: 2
    workerHeapMiB: 256
    controlThreads: 4
    pollMillis: 3000
    autoStart: false
    auditMaxEvents: 1000000
    sessions:
      enabled: true
      secureCookie: true
      rememberBrowser: false
      idleSeconds: 1800
      absoluteSeconds: 28800
      maximum: 1000
    cluster:
      sharedAccess: false
      id: "migration-registry"
      nodeId: ${RIVOMESH_NODE_ID}
      driver: "org.postgresql.Driver"
      url: "jdbc:postgresql://control-db:5432/rivomesh_control"
      namespace: "rivomesh_control"
      username: ${RIVOMESH_CONTROL_USERNAME}
      password: ${RIVOMESH_CONTROL_PASSWORD}
      advertiseUrl: "http://rivomesh-node-a.rivomesh.svc:8080"
      heartbeatMillis: 2000
      leaseMillis: 15000
      maximumNodes: 1000
---
# Source: rivomesh/templates/pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rivomesh-node-a-data
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: "10Gi"
---
# Source: rivomesh/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: rivomesh-node-a
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rivomesh-node-a
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Source: rivomesh/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rivomesh-node-a
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rivomesh-node-a
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rivomesh-node-a
      annotations:
        checksum/config: 3169731f48c201ad3eed7e278de322ceba87a43e2e7a1a857942bf4672b993f1
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: rivomesh
          image: "rivomesh:0.1.0-SNAPSHOT"
          imagePullPolicy: IfNotPresent
          args: [serve, /app/config/platform.yml]
          env:
            - name: RIVOMESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rivomesh-auth
                  key: token
            - name: RIVOMESH_NODE_ID
              value: "rivomesh-node-a"
            - name: RIVOMESH_CONTROL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: "rivomesh-control-store"
                  key: "username"
            - name: RIVOMESH_CONTROL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "rivomesh-control-store"
                  key: "password"
            - name: JAVA_TOOL_OPTIONS
              value: -Xmx128m
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - {name: config, mountPath: /app/config, readOnly: true}
            - {name: data, mountPath: /app/data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: rivomesh-node-a-config
        - name: data
          persistentVolumeClaim:
            claimName: rivomesh-node-a-data
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
