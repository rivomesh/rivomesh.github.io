services:
  rivomesh:
    image: rivomesh:0.1.0-SNAPSHOT
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      RIVOMESH_TOKEN: ${RIVOMESH_TOKEN:?Set a private token of at least 24 bytes}
      JAVA_TOOL_OPTIONS: -Xmx512m
    volumes:
      - rivomesh-data:/app/data
    stop_grace_period: 90s
    restart: unless-stopped
    mem_limit: 2g
volumes:
  rivomesh-data:
